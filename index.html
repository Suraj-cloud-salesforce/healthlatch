        body {

        header {

            padding: 18px 40px;

        .logo {

        }

        .image-wrapper {
            position: relative;
            width: 420px;
        }

        .image-bg {
            position: absolute;
            top: 40px;
            left: -40px;
            width: 420px;
            height: 420px;
            background: #0a7f8c;
            border-radius: 24px;
            z-index: 1;
        }

        .hero-img {
            position: relative;
            width: 420px;
            height: 420px;
            object-fit: cover;
            border-radius: 24px;
            z-index: 2;
        }

        .content {
            max-width: 520px;
        }

        .content h1 {

            color: #0a7f8c;
            margin-bottom: 24px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 28px;

        }

        .primary-btn {
            background: #ffeb3b;
            border: none;
            padding: 14px 24px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-img,
            .image-bg {
                width: 300px;
                height: 300px;
            }
        } 

        #chatTeaser {
    position: fixed;
    right: 28px;
    bottom: 110px;
    background: #0a7f8c;
    color: #ffffff;
    padding: 12px 18px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 999999;
    max-width: 260px;
    text-align: center;
    animation: fadeInUp 0.4s ease;
}

/* Arrow pointer */
#chatTeaser::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 20px;
    border-width: 8px;
    border-style: solid;
    border-color: #0a7f8c transparent transparent transparent;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>

    } catch (err) {
      console.error('Error loading Embedded Messaging:', err);
    }
  }

  // When Messaging is ready
  window.addEventListener("onEmbeddedMessagingReady", () => {

      setTimeout(() => {

          teaser = document.createElement("div");
          teaser.id = "chatTeaser";
          teaser.innerHTML = "Came for onboarding? Start here 👋";

          document.body.appendChild(teaser);

          teaser.addEventListener("click", function () {
              hideTeaser();
              openChat();
          });

      }, 1500);
  });

  // 🔥 When conversation actually starts → hide teaser
  window.addEventListener("onEmbeddedMessagingConversationStarted", function () {
      hideTeaser();
  });

  function openChat() {
      if (embeddedservice_bootstrap.utilAPI) {
          embeddedservice_bootstrap.utilAPI.launchChat();
      } else {
          embeddedservice_bootstrap.open();
      }
  }

  function hideTeaser() {
      if (teaser) {
          teaser.style.display = "none";
      }
  }
</script>
