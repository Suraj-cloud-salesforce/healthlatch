<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Teqfocus Health Cloud – Agent Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #0f3c46;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo img {
            height: 42px;
            width: auto;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: #0f3c46;
            font-size: 14px;
        }

        .message-btn {
            background: linear-gradient(135deg, #7b61ff, #b86cff);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .hero {
            min-height: 520px;
            display: flex;
            align-items: center;
            padding: 80px 60px;
            background: url("./TeqSechedular banner.jpg") center/cover no-repeat;
            position: relative;
            color: #fff;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(10, 20, 60, 0.7),
                rgba(90, 50, 160, 0.5)
            );
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .content h1 {
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 26px;
            color: #eaeaff;
        }

        .primary-btn {
            background: #ffffff;
            color: #5a3ec8;
            border: none;
            padding: 14px 26px;
            border-radius: 24px;
            font-weight: 700;
            cursor: pointer;
        }

        #agent-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <!-- Upload this image to your hosting and replace path -->

        <strong>Teqfocus Health Cloud</strong>
    </div>

    <nav>
        <a href="#">Start Here</a>
        <a href="#">Solutions</a>
        <a href="#">About</a>
        <a href="#">Resources</a>
        <a href="#">Contact</a>
    </nav>

    <button class="message-btn">CHAT WITH US</button>
</header>

<section class="hero">

        </h1>

        <p>
            Teqfocus Health Cloud helps healthcare organizations automate workflows,
            connect teams, and deliver better patient engagement using AI-driven solutions.
        </p>

        <button class="primary-btn">
            Explore Teqfocus Health Cloud
